<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport settings for responsiveness -->

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <!-- Apple PWA Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- Favicon for various devices -->
    <link rel="icon" type="image/svg+xml" href="/gbedos-mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/gbedos-icon_32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/gbedos-icon_96.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/gbedos-icon_192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/gbedos-icon_512.png">

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="120x120" href="/gbedos-icon_120.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/gbedos-icon_144.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/gbedos-icon_180.png">

    <!-- Windows Tile Icons -->
    <meta name="msapplication-TileImage" content="/gbedos-icon_144.png">
    <meta name="msapplication-TileColor" content="#0B0C0E">

    <!-- Theme color for mobile address bar -->
    <meta name="theme-color" content="#0B0C0E">

    <title>GBedOS</title>

    <!-- Preconnect to external resources for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;700&display=swap" />
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
